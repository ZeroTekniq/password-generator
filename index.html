<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./starter-code/assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./dist/styles.css">
  
  <title>Frontend Mentor | Password generator app</title>
</head>
<body>

  <header>Password Generator</header>

  <output>
    <div class="generator-output-wrapper">
      <p class="output-title">P4$5W0rD!</p>
      <img src="./starter-code/assets/images/icon-copy.svg" alt="Copy button">
    </div>
  </output>

  <div class="settings-container">
    <section>
      <div class="slider-wrapper">
        <div class="label-slider-flexbox">
          <div class="slider-label-flexbox">
            <p class="slider-title">Character Length</p><span class="length-value">0</span>
          </div>
          <input class="slider" type="range" min="0" max="20" value="0" step="1" id="slider">
        </div>
      </div>
    </section>
    <div class="checkbox-wrapper">
      <div class="checkbox-flexbox">
        <div class="checkbox"></div><img src="./starter-code/assets/images/icon-check.svg" alt="checkbox"><p>Include Uppercase Letters</p>
      </div>
      <div class="checkbox-flexbox">
        <div class="checkbox"></div><img src="./starter-code/assets/images/icon-check.svg" alt="checkbox"><p>Include Lowercase Letters</p>
      </div>
      <div class="checkbox-flexbox">
        <div class="checkbox"></div><img src="./starter-code/assets/images/icon-check.svg" alt="checkbox"><p>Include Numbers</p>
      </div>
      <div class="checkbox-flexbox">
        <div class="checkbox"></div><img src="./starter-code/assets/images/icon-check.svg" alt="checkbox"><p>Include Symbols</p>
      </div>
    </div>
    
    <section>
      <div class="strength-states-wrapper">
        <p class="strength-title">Strength</p>
        <div class="strength-states-flexbox">
          <div class="strength-state-box"></div>
          <div class="strength-state-box"></div>
          <div class="strength-state-box"></div>
          <div class="strength-state-box"></div>
        </div>
      </div>
    </section>
    <div class="button-wrapper">
        <button class="button-flexbox">Generate <img src="./starter-code/assets/images/icon-arrow-right.svg" alt="Arrow right">
        </button>
    </div>
  </div>

</body>
</html>
